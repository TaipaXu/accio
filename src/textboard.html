<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accio - Textboard</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --text: #0f172a;
            --muted: #475569;
            --card: #ffffff;
            --border: #d8dee9;
            --accent: #2563eb;
            --accent-contrast: #ffffff;
        }

        :root[data-theme="dark"] {
            --bg: #0f172a;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --card: #111827;
            --border: #1f2937;
            --accent: #60a5fa;
            --accent-contrast: #0b1220;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0 10px;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 2px 8px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .home-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: var(--accent);
        }

        .theme-toggle {
            margin-left: auto;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        .board {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 12px 16px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .board:empty::before {
            content: "No messages yet";
            color: var(--muted);
            font-style: italic;
        }

        .message {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .message:hover {
            border-color: var(--accent);
        }

        .message:last-child {
            margin-bottom: 0;
        }

        .message-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 0 0 10px;
        }

        .input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .send-btn {
            padding: 10px 20px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: var(--accent-contrast);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.15s ease;
            align-self: flex-end;
        }

        .send-btn:hover {
            filter: brightness(1.05);
        }

        .send-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Accio Textboard</h1>
        <div style="flex: 1;"></div>
        <a class="home-link" href="/">Home</a>
        <button class="theme-toggle" type="button">Dark mode</button>
    </header>

    <div class="board" id="board"></div>

    <div class="input-area">
        <textarea class="message-input" rows="3"
            placeholder="Enter text... (Enter to send, Shift+Enter for new line)"></textarea>
        <button class="send-btn" id="sendBtn">Send</button>
    </div>

    <script>
        const THEME_KEY = 'accio-theme';
        const themeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

        const hasStoredTheme = () => localStorage.getItem(THEME_KEY) !== null;
        const applyTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
        };

        const initTheme = () => {
            const stored = localStorage.getItem(THEME_KEY);
            if (stored === 'light' || stored === 'dark') {
                applyTheme(stored);
                return stored;
            }
            const system = themeMediaQuery.matches ? 'dark' : 'light';
            applyTheme(system);
            return system;
        };

        const $themeToggle = document.querySelector('.theme-toggle');
        let currentTheme = initTheme();

        const updateToggleLabel = () => {
            $themeToggle.textContent = currentTheme === 'dark' ? 'Light mode' : 'Dark mode';
        };

        const setTheme = (theme) => {
            currentTheme = theme;
            applyTheme(theme);
            localStorage.setItem(THEME_KEY, theme);
            updateToggleLabel();
        };

        $themeToggle.addEventListener('click', () => {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        themeMediaQuery.addEventListener('change', (event) => {
            if (!hasStoredTheme()) {
                currentTheme = event.matches ? 'dark' : 'light';
                applyTheme(currentTheme);
                updateToggleLabel();
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === THEME_KEY && (event.newValue === 'dark' || event.newValue === 'light')) {
                currentTheme = event.newValue;
                applyTheme(currentTheme);
                updateToggleLabel();
            }
        });

        updateToggleLabel();

        // --- Textboard functionality ---
        const $board = document.querySelector('.board');
        const $input = document.querySelector('.message-input');
        const $sendButton = document.querySelector('.send-btn');

        const createMessageElement = ({ ip, text, time }) => {
            const $message = document.createElement('div');
            $message.className = 'message';

            const $meta = document.createElement('div');
            $meta.className = 'message-meta';
            if (ip) {
                const $ipSpan = document.createElement('span');
                $ipSpan.textContent = ip;
                $meta.appendChild($ipSpan);
            }
            if (time) {
                const $timeSpan = document.createElement('span');
                $timeSpan.textContent = time;
                $meta.appendChild($timeSpan);
            }
            if ($meta.childElementCount) $message.appendChild($meta);

            const $body = document.createElement('div');
            $body.textContent = text;
            $message.appendChild($body);

            $message.addEventListener('click', () => {
                navigator.clipboard.writeText(text).then(() => {
                    $message.style.borderColor = 'var(--accent)';
                    setTimeout(() => { $message.style.borderColor = ''; }, 300);
                });
            });
            return $message;
        };

        const eventSource = new EventSource('/textboard/events');
        eventSource.onopen = () => { $board.innerHTML = ''; };
        eventSource.onmessage = (event) => {
            try {
                const entry = JSON.parse(event.data);
                $board.appendChild(createMessageElement(entry));
            } catch {
                $board.appendChild(createMessageElement({ text: event.data }));
            }
            $board.scrollTop = $board.scrollHeight;
        };

        const sendMessage = async () => {
            const text = $input.value.trim();
            if (!text) return;
            $sendButton.disabled = true;
            try {
                const response = await fetch('/textboard/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: text
                });
                if (response.ok) {
                    $input.value = '';
                } else {
                    alert(await response.text() || 'Failed to send');
                }
            } catch (error) {
                alert('Network error');
            } finally {
                $sendButton.disabled = false;
                $input.focus();
            }
        };

        $sendButton.addEventListener('click', sendMessage);
        $input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

</html>
